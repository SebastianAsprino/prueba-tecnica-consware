name: API (.NET)

on:
  push:
    branches: [main]
    paths:
      - "api-net-core/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api-net-core/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-net-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ExpenseReimbursement.sln

      - name: Build
        run: dotnet build ExpenseReimbursement.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ExpenseReimbursement.sln --no-build --configuration Release --verbosity normal
